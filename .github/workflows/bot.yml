name: meclis-belge-bot

on:
  schedule:
    # Cron saat basi yazili ama GitHub bunu public repoda yogunlukta atliyor:
    # olculen gercek siklik ~6.4 saatte bir, gunde ~3.8 kosu.
    # Hiz artik run.js icinde gunluk hedefle ayarlaniyor: bekleyen onerge sayisi
    # bir sonraki pazartesiye kalan gune bolunur, gun icinde saate orantili acilir.
    # MAX_POSTS_PER_RUN yalnizca guvenlik siniri; 20 x 120 sn = 40 dk.
    # Yalniz uyanik saatler: UTC 04-19 = TRT 07:00-22:00. GitHub 40-90 dk
    # geciktirdigi icin en gec ~23:30 TRT'de duser. Gece atilan gonderi
    # goruntulenme almiyor, ustelik bakiye yakiyordu.
    - cron: "17 4-19 * * *"
  workflow_dispatch:         # elle tetikleme

permissions:
  contents: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Çalıştır
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          MAX_POSTS_PER_RUN: "20"
          MAX_POSTS_PER_DAY: "40"
          POST_GAP_SECONDS: "120"
        run: node src/run.js

      - name: Oylamalar
        if: always()
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          MAX_POSTS_PER_RUN: "7"
          POST_GAP_SECONDS: "120"
          OYLAMA_LOOKBACK: "4"
        run: node src/oylama.js

      - name: state.json commit
        if: always()
        run: |
          git config user.name "meclis-belge-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json state-oylama.json
          git diff --cached --quiet || git commit -m "state: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash -q || true
          git push
