name: meclis-belge-bot

on:
  schedule:
    # Cron saat basi yazili ama GitHub bunu public repoda yogunlukta atliyor:
    # olculen gercek siklik ~6.4 saatte bir, gunde ~3.8 kosu. Bu yuzden hiz
    # kosu sayisiyla degil, kosu basina gonderiyle ayarlaniyor.
    # 71 onergelik kuyruk icin: 3.8 kosu/gun x 1.5 gun = ~5.7 kosu -> kosu
    # basina 13 gonderi. 13 x 150 sn = ~33 dk, is zaman asimi 60 dk.
    - cron: "17 * * * *"
  workflow_dispatch:         # elle tetikleme

permissions:
  contents: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Çalıştır
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          MAX_POSTS_PER_RUN: "13"
          POST_GAP_SECONDS: "150"
        run: node src/run.js

      - name: state.json commit
        if: always()
        run: |
          git config user.name "meclis-belge-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "state: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
