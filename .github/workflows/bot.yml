name: meclis-belge-bot

on:
  schedule:
    # Genel Kurul tempusu (1 Ekim'den itibaren): saat basi kosu.
    # Yasama yilinin ilk Gelen Kagidi tatil birikimini tasir (gecen 3 yil: 133, 72, 58
    # onerge). MAX 2 ile boyle bir yigin 2 gunde erir; normal gunlerde (2-4 onerge)
    # ayni gun icinde atilir. Yigini daha hizli eritmek icin MAX_POSTS_PER_RUN artirilir.
    - cron: "17 * * * *"
  workflow_dispatch:         # elle tetikleme

permissions:
  contents: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Çalıştır
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          MAX_POSTS_PER_RUN: "2"
          POST_GAP_SECONDS: "150"
        run: node src/run.js

      - name: state.json commit
        if: always()
        run: |
          git config user.name "meclis-belge-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "state: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
